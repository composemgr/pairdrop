# nginx proxy address - http://172.17.0.1:64292

name: pairdrop
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: pairdrop-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      RATE_LIMIT: "false"
      WS_FALLBACK: "false"
    ports:
      - '172.17.0.1:64292:3000'
    volumes:
      - './volumes/config/pairdrop:/config'
    networks:
      - pairdrop

networks:
  pairdrop:
    name: pairdrop
    external: false
