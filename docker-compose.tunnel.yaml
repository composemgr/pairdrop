name: pairdrop
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: pairdrop-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      RATE_LIMIT: "false"
      WS_FALLBACK: "false"
    volumes:
      - './volumes/config/pairdrop:/config'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://pairdrop-server:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - pairdrop
      - cloudflare

networks:
  pairdrop:
    name: pairdrop
    external: false
  cloudflare:
    external: true
